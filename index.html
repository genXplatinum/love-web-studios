<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111217" />

    <!-- SEO:START -->
    <title>Lovelace | Web Design and Development Studio</title>
    <meta
      name="description"
      content="Lovelace designs and builds websites, web apps, brand identities and 3D web experiences for businesses worldwide."
    />
    <meta name="author" content="Lovepreet Singh" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://lovelace.co.in/" />
    <meta property="og:title" content="Lovelace | Web Design and Development" />
    <meta property="og:description" content="Lovelace designs and builds websites, web apps, brand identities and 3D web experiences for businesses worldwide." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lovelace.co.in/" />
    <meta property="og:image" content="https://lovelace.co.in/og.png" />
    <meta property="og:image:alt" content="Lovelace web design and development studio." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lovelace | Web Design and Development" />
    <meta name="twitter:description" content="Lovelace designs and builds websites, web apps, brand identities and 3D web experiences for businesses worldwide." />
    <meta name="twitter:image" content="https://lovelace.co.in/og.png" />
    <meta name="twitter:image:alt" content="Lovelace web design and development studio." />
    <script id="seo-structured-data" type="application/ld+json">
      {"@context":"https://schema.org","@type":"WebSite","url":"https://lovelace.co.in/","name":"Lovelace"}
    </script>
    <!-- SEO:END -->

    <meta property="og:site_name" content="Lovelace" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image:secure_url" content="https://lovelace.co.in/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style id="seo-fallback-styles">
      .seo-fallback {
        max-width: 1180px;
        margin: 0 auto;
        padding: 32px 24px 80px;
        color: #111217;
        font-family: Inter, Arial, sans-serif;
      }
      .seo-fallback__nav,
      .seo-fallback__links {
        display: flex;
        flex-wrap: wrap;
        gap: 16px 28px;
      }
      .seo-fallback__brand {
        display: inline-block;
        margin-bottom: 28px;
        color: inherit;
        font-size: 28px;
        font-weight: 800;
        text-decoration: none;
      }
      .seo-fallback__nav {
        margin-bottom: 72px;
      }
      .seo-fallback a {
        color: inherit;
      }
      .seo-fallback__eyebrow {
        color: #1e37f0;
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
      }
      .seo-fallback h1 {
        max-width: 900px;
        margin: 18px 0;
        font-family: "Bricolage Grotesque", Arial, sans-serif;
        font-size: 88px;
        line-height: 0.95;
      }
      .seo-fallback__intro {
        max-width: 720px;
        font-size: 21px;
        line-height: 1.55;
      }
      .seo-fallback__highlights {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 32px;
        margin: 72px 0;
        padding-top: 32px;
        border-top: 1px solid #c7c9d2;
      }
      .seo-fallback h2 {
        margin: 0 0 12px;
        font-size: 24px;
      }
      .seo-fallback p {
        line-height: 1.65;
      }
      @media (max-width: 640px) {
        .seo-fallback {
          padding: 24px 20px 64px;
        }
        .seo-fallback__nav {
          margin-bottom: 48px;
        }
        .seo-fallback h1 {
          font-size: 48px;
        }
        .seo-fallback__intro {
          font-size: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
